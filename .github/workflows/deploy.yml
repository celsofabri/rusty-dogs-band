# Build do site Gatsby e publicacao no GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissoes necessarias para o deploy via GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; execucoes na fila sao substituidas pela mais recente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Cache do Gatsby
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public
          key: ${{ runner.os }}-gatsby-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gatsby-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-gatsby-

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        # --prefix-paths e obrigatorio: o site vive em /rusty-dogs-band.
        run: npm run build:pages
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Opcional: crie o secret para ativar o envio real do formulario.
          GATSBY_FORMSPREE_ID: ${{ secrets.GATSBY_FORMSPREE_ID }}

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
